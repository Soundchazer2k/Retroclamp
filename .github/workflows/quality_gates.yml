name: Quality Gates

on:
  push:
    branches: [ main, dev-* ]
  pull_request:
    branches: [ main ]

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libgl1 libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pre-commit pytest pytest-cov bandit safety

    - name: Run pre-commit hooks
      run: pre-commit run --all-files

    - name: Run tests with coverage
      run: |
        export PYTHONPATH=$PYTHONPATH:.
        # Ensure chdman.exe is executable if it exists
        if [ -f "bin/chdman.exe" ]; then chmod +x bin/chdman.exe; fi
        if [ -f "tools/bin/chdman.exe" ]; then chmod +x tools/bin/chdman.exe; fi # Common alternative path
        if [ -f "retroclamp/bin/chdman.exe" ]; then chmod +x retroclamp/bin/chdman.exe; fi # Another common alternative

        if [ -d "tests" ] || find . -name "*test*.py" | grep -q .; then
          pytest --cov=. --cov-report=xml --cov-report=term
        else
          echo "No tests found - please add unit tests"
        fi

    - name: Upload Test Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: test-artifacts
        path: |
          ./coverage.xml
          ./bandit-report.json
          ./safety-report.json
        retention-days: 5

    - name: Security checks
      run: |
        bandit -r . -f json -o bandit-report.json || true
        safety check --json --output safety-report.json || true

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.10'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml

    - name: Retroclamp-specific checks
      run: |
        # Run custom analysis if available
        if [ -f "retroclamp_analyzer.py" ]; then
          python retroclamp_analyzer.py . --output analysis-report.json
        fi

        # Run focused component analysis if available
        if [ -f "focused_analysis.py" ]; then
          python focused_analysis.py all . --output focused-report.json
        fi

    - name: Archive analysis reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: analysis-reports-${{ matrix.python-version }}
        path: |
          bandit-report.json
          safety-report.json
          analysis-report.json
          focused-report.json
