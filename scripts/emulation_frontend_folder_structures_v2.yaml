# HyperSpin (Windows)
frontend: "HyperSpin"
used_by:
  - "HyperSpin 1.5+ (Windows frontend)"
folders:
  Media:
    path: "HyperSpin/Media/<System>/"
    required: true
    description: "All media for a given system"
  Images:
    path: "HyperSpin/Media/<System>/Images/[Wheel|Artwork1|Artwork2|Backgrounds]/"
    required: false
    description: "Artwork subfolders"
  Themes:
    path: "HyperSpin/Media/<System>/Themes/"
    required: false
    description: "Theme pack ZIPs"
  Video:
    path: "HyperSpin/Media/<System>/Video/"
    required: false
    description: "Gameplay preview videos"
  Databases:
    path: "HyperSpin/Databases/<System>/<System>.xml"
    required: true
    description: "XML game list database"
  Settings:
    path: "HyperSpin/Settings/<System>.ini"
    required: true
    description: "System-specific INI configs"
  Emulators:
    path: "HyperSpin/Emulators/<EmulatorName>/"
    required: false
    description: "Optional emulator binaries"
systems:
  <<: *EmulationStation-Style.systems
