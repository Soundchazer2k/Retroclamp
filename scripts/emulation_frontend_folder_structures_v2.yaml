# EmulationStation-Style (RetroPie, Recalbox, Batocera, EmuELEC, RetroBat)
frontend: "EmulationStation-Style"
used_by:
  - "RetroPie (EmulationStation on Raspberry Pi/Linux)"
  - "Recalbox"
  - "Batocera.linux"
  - "EmuELEC"
  - "RetroBat (Windows)"
folders:
  bios:
    path: "<BaseDir>/bios/"
    required: true
    description: "System BIOS and firmware files directory"
  roms:
    path: "<BaseDir>/roms/<System>/"
    required: true
    description: "ROM files organized into subfolders by system"
  saves:
    path: "<BaseDir>/saves/<System>/"
    required: false
    description: "Saved game files (if not stored in emulator-specific configs)"
  media:
    path: "<BaseDir>/roms/<System>/[images|videos]/ or <BaseDir>/.emulationstation/"
    required: false
    description: "Scraped media (box art, screenshots, video snaps)"
  gamelists:
    path: "<BaseDir>/roms/<System>/gamelist.xml or <BaseDir>/.emulationstation/gamelists/<System>.xml"
    required: false
    description: "Game metadata XML files"
  configs:
    path: "<BaseDir>/configs/<System>/ or <BaseDir>/system/"
    required: false
    description: "Emulator configuration files and system settings"
systems:
  Atari 2600:
    folder: atari2600
    file_extensions: [".a26", ".bin", ".zip"]
    example_roms: ["Pitfall! (USA).bin", "Space Invaders (Europe).a26"]
  Atari 5200:
    folder: atari5200
    file_extensions: [".a52", ".bin", ".zip"]
    example_roms: ["Pac-Man (USA).bin"]
  Atari 7800:
    folder: atari7800
    file_extensions: [".a78", ".bin", ".zip"]
    example_roms: ["Asteroids (USA).a78"]
  Atari Lynx:
    folder: lynx
    file_extensions: [".lnx", ".zip"]
    example_roms: ["California Games (USA).lnx"]
  Nintendo Entertainment System:
    folder: nes
    file_extensions: [".nes", ".zip", ".7z"]
    example_roms: ["Super Mario Bros. (USA).nes", "Mega Man 2 (Europe).nes"]
  Famicom Disk System:
    folder: fds
    file_extensions: [".fds", ".zip"]
    example_roms: ["Zelda no Densetsu (Japan).fds"]
  Super Nintendo Entertainment System:
    folder: snes
    file_extensions: [".smc", ".sfc", ".zip", ".7z"]
    example_roms: ["Super Mario World (USA).smc"]
  Nintendo 64:
    folder: n64
    file_extensions: [".n64", ".z64", ".v64", ".zip"]
    example_roms: ["Super Mario 64 (USA).z64"]
  Nintendo DS:
    folder: nds
    file_extensions: [".nds", ".zip"]
    example_roms: ["Pokémon Diamond (USA).nds"]
  Nintendo 3DS:
    folder: 3ds
    file_extensions: [".3ds", ".cci", ".zip"]
    example_roms: ["The Legend of Zelda - Ocarina of Time 3D (USA).3ds"]
  Game Boy:
    folder: gb
    file_extensions: [".gb", ".zip"]
    example_roms: ["Tetris (World).gb"]
  Game Boy Color:
    folder: gbc
    file_extensions: [".gbc", ".zip"]
    example_roms: ["Pokemon Yellow (USA).gbc"]
  Game Boy Advance:
    folder: gba
    file_extensions: [".gba", ".zip"]
    example_roms: ["Metroid Fusion (USA).gba"]
  Sega Master System:
    folder: mastersystem
    file_extensions: [".sms", ".zip"]
    example_roms: ["Sonic the Hedgehog (USA).sms"]
  Sega Genesis/Mega Drive:
    folder: megadrive
    file_extensions: [".bin", ".gen", ".md", ".smd", ".zip"]
    example_roms: ["Sonic the Hedgehog (USA).bin"]
  Sega CD/Mega-CD:
    folder: segacd
    file_extensions: [".cue", ".iso", ".chd", ".zip"]
    example_roms: ["Sonic CD (USA).cue"]
  Sega 32X:
    folder: sega32x
    file_extensions: [".32x", ".bin", ".smd", ".zip"]
    example_roms: ["Knuckles' Chaotix (USA).32x"]
  Sega Saturn:
    folder: saturn
    file_extensions: [".cue", ".iso", ".chd"]
    example_roms: ["NiGHTS into Dreams... (USA).cue"]
  Sega Dreamcast:
    folder: dreamcast
    file_extensions: [".cdi", ".gdi", ".chd", ".zip"]
    example_roms: ["SoulCalibur (USA).gdi"]
  NEC TurboGrafx-16 / PC Engine:
    folder: pcengine
    file_extensions: [".pce", ".zip"]
    example_roms: ["Bonk's Adventure (USA).pce"]
  NEC TurboGrafx-CD / PC Engine CD:
    folder: pcenginecd
    file_extensions: [".cue", ".iso", ".chd"]
    example_roms: ["Castlevania – Rondo of Blood (Translated).cue"]
  Neo Geo AES/MVS:
    folder: neogeo
    file_extensions: [".zip"]
    example_roms: ["Metal Slug (World).zip"]
  Neo Geo Pocket:
    folder: ngp
    file_extensions: [".ngp", ".zip"]
    example_roms: ["SNK vs. Capcom – Match of the Millennium (World).ngp"]
  Neo Geo Pocket Color:
    folder: ngpc
    file_extensions: [".ngc", ".zip"]
    example_roms: ["Metal Slug – 1st Mission (World).ngc"]
  Commodore 64:
    folder: c64
    file_extensions: [".d64", ".t64", ".crt", ".tap", ".zip"]
    example_roms: ["Impossible Mission (Europe).d64"]
  Commodore Amiga:
    folder: amiga
    file_extensions: [".adf", ".adz", ".dms", ".hdf", ".zip"]
    example_roms: ["Lemmings (USA).adf"]
  MS-DOS:
    folder: dos
    file_extensions: [".zip", ".exe", ".com", ".bat"]
    example_roms: ["DOOM (1993).zip"]
  ScummVM:
    folder: scummvm
    file_extensions: [".scummvm", ".svm"]
    example_roms: ["Monkey Island 2.scummvm"]
  Arcade (MAME):
    folder: mame
    file_extensions: [".zip", ".7z"]
    example_roms: ["sf2.zip"]

