# LaunchBox / BigBox (Windows, Android)
frontend: "LaunchBox/BigBox"
used_by:
  - "LaunchBox (Windows)"
  - "LaunchBox (Android)"
folders:
  Games:
    path: "LaunchBox/Games/<Platform>/"
    required: true
    description: "ROM files organized by platform"
  Images:
    path: "LaunchBox/Images/<Platform>/<ImageType>/"
    required: false
    description: "Game images by platform and type"
