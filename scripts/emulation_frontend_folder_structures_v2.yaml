    path: "LaunchBox/Videos/<Platform>/"
    required: false
    description: "Game video snaps by platform"
  Manuals:
    path: "LaunchBox/Manuals/<Platform>/"
    required: false
    description: "Game manuals by platform"
  Music:
    path: "LaunchBox/Music/<Platform>/"
    required: false
    description: "Platform soundtrack music"
