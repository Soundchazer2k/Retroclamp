```yaml
# Attract-Mode (Windows/Linux)
frontend: "Attract-Mode"
used_by:
  - "Attract-Mode (Windows/Linux)"
folders:
  romlists:
    path: "<ConfigDir>/romlists/<System>.txt"
    required: true
    description: "Game list files per system"
  layouts:
    path: "<ConfigDir>/layouts/<LayoutName>/"
    required: false
    description: "Theme/layout directories"
  scraper:
    path: "<ConfigDir>/scraper/<System>/<ArtworkType>/"
    required: false
    description: "Scraped media output"
  artwork_paths:
    path: "User-defined per emulator (e.g. D:/Media/<System>/<Type>/)"
    required: false
    description: "Custom artwork directories"
  plugins:
    path: "<ConfigDir>/plugins/<PluginName>.nut"
    required: false
    description: "Optional plugin scripts"
  modules:
    path: "<ConfigDir>/modules/<ModuleName>.nut"
    required: false
    description: "Optional scripting modules"
  config_files:
    path: "<ConfigDir>/attract.cfg or emulators.cfg"
    required: true
    description: "Main Attract-Mode config files"
systems:
  <<: *EmulationStation-Style.systems
