repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.11.10
  hooks:
    - id: ruff
      args: [--fix]
    - id: ruff-format
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: check-yaml
  - id: end-of-file-fixer
  - id: trailing-whitespace
  - id: check-merge-conflict
- repo: https://github.com/PyCQA/bandit
  rev: 1.8.3
  hooks:
  - id: bandit
    entry: bandit -r . --format txt
    pass_filenames: false
    args: [--severity-level=high]
    exclude: ^bandit_report.txt$
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.15.0
  hooks:
  - id: mypy
    args:
    - --ignore-missing-imports
- repo: local
  hooks:
  - id: retroclamp-chdman-security
    name: CHDMAN Security Check
    entry: python scripts/chdman_security_check.py
    language: system
    files: ^core/.*\.py$
  - id: retroclamp-plugin-validation
    name: Plugin API Validation
    entry: python scripts/validate_plugins.py
    language: system
    files: ^tools/.*\.py$
