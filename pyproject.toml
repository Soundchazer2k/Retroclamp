[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retroclamp"
description = "Modern GUI for CHDMAN operations and disk image management"
readme = "README.md"
license = {text = "MIT"}
dynamic = ["version", "dependencies"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
# Ruff configuration
line-length = 88
target-version = "py38"

[tool.ruff.lint]
# Enable the rules you want
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

# Ignore specific rules
ignore = [
    "E203",  # Whitespace before ':'
    "E402",  # Module level import not at top (for now)
]

[tool.ruff.lint.per-file-ignores]
# Allow unused imports in __init__.py files
"__init__.py" = ["F401"]
# Allow longer lines in test files
"tests/**" = ["E501"]

[tool.ruff.format]
# Use single quotes instead of double quotes
quote-style = "double"
# Indent with 4 spaces
indent-style = "space"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=. --cov-report=term-missing"
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101"]
severity_level = "HIGH"

[tool.mypy]
python_version = "3.8"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
install_types = true
non_interactive = true
